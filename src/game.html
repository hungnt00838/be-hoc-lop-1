  function pushBits(arr, v, n) { for (var i = n - 1; i >= 0; i--) arr.push(Math.floor(v / Math.pow(2, i)) % 2); }

    r = { st: [], seeds: readBits(b, 40, 16), fed: readBits(b, 56, 10), stk: {} };
    for (i = 0; i < STAGES.length; i++) { r.st.push(readBits(b, i * 2, 2)); if (r.st[i] === 3) r.stk[i] = 1; }

  function mazeMove(d) {

    while (MZ.cell[MZ.pos] & BIT[d]) {

      open = 0; nd = -1;

    var r = rng(lv * 104729 + 3), cols, rows, nd, kinds, n, i, a = [], b = [], pool = rshuf(r, ICON_WORDS), diffs = [], idx, k, w;
    if (lv <= 10) { cols = 3; rows = 3; nd = 3; } else if (lv <= 25) { cols = 4; rows = 3; nd = 4; } else if (lv <= 40) { cols = 4; rows = 4; nd = 5; } else { cols = 5; rows = 4; nd = 6; }
    kinds = lv <= 15 ? ["doi", "mat", "them"] : (lv <= 30 ? ["doi", "mat", "them", "nho"] : ["doi", "mat", "them", "nho", "lat", "lat"]);

    for (i = 0; i < n; i++) b.push(a[i] ? { w: a[i].w, m: 0, s: 1 } : null);

    for (i = 0; i < order.length && diffs.length < nd; i++) {

      if (k === "lat" && DF_MIR.indexOf(a[idx].w) < 0) k = "nho";
      if (k === "doi") { do { w = pool[rint(r, pool.length)]; } while (w === a[idx].w); b[idx] = { w: w, m: 0, s: 1 }; }

    for (i = 0; i < NT.list.length; i++) {
      n = NT.list[i];
      h += '<div class="pick notebox"><div class="note-d">' + dstr(n.ts) + " " + pad2(new Date(n.ts).getHours()) + ":" + pad2(new Date(n.ts).getMinutes()) + "</div>" +
        '<div class="note-t">' + esc(n.text).replace(/\n/g, "<br>") + "</div>" +
        '<button class="btn small' + (NT.arm === i ? " dark" : "") + '" data-act="delnote" data-v="' + i + '">' + (NT.arm === i ? "Bấm lần nữa để xoá" : "Xoá") + "</button></div>";
    }
    app.innerHTML = h;
  }
  function loadNotes() {
    api({ action: "notes", name: NAME, pin: PIN }, function (err, r) {
      if (S.mode !== "notes") return;
      NT.list = err ? [] : r.notes;
      notesScreen(err ? "Không tải được ghi chú: " + err.msg : undefined);
    });
  }
  function addNote() {
    var el = document.getElementById("note"), t = el && el.value ? String(el.value).replace(/^\s+|\s+$/g, "") : "";
    if (!t) { notesScreen("Bé chưa viết gì cả!"); return; }
    NT.arm = -1;
    app.innerHTML = topBar("Ghi chú") + '<h2>Đang lưu...</h2>';
    api({ action: "addNote", name: NAME, pin: PIN, text: t }, function (err, r) {
      if (err) { NT.msg = "Chưa lưu được: " + err.msg; notesScreen(); var e2 = document.getElementById("note"); if (e2) e2.value = t; return; }
      NT.list = r.notes; notesScreen("Đã lưu ghi chú!");
    });
  }
  function delNote(i) {
    if (NT.arm !== i) { NT.arm = i; NT.msg = ""; notesScreen(); return; }
    var n = NT.list[i]; NT.arm = -1;
    if (!n) return;
    api({ action: "delNote", name: NAME, pin: PIN, ts: n.ts }, function (err, r) {
      if (err) { notesScreen("Không xoá được: " + err.msg); return; }
      NT.list = r.notes; notesScreen("Đã xoá ghi chú.");
    });
  }

  // ================= XỬ LÝ CHẠM =================
  function findBtn(el) {
    while (el && el !== app) { if (el.tagName === "BUTTON") return el; el = el.parentNode; }
    return null;
  }
  app.onclick = function (ev) {
    ev = ev || window.event;
    var b = findBtn(ev.target || ev.srcElement), act, v, q, built, i;
    if (!b) return;
    act = b.getAttribute("data-act"); v = b.getAttribute("data-v");
    if (!act) return;
    var scroll = true;
    if (act === "home") home();
    else if (act === "who0") nameScreen();
    else if (act === "who") {
      var wn = players()[parseInt(v, 10)];
      if (!ONLINE || pins()[wn]) doLogin(wn, pins()[wn]); else nameScreen("Nhập ngày sinh của " + esc(wn) + " nhé.", wn);
    }
    else if (act === "setname") setName();
    else if (act === "backup") backup();
    else if (act === "monsters") monsters();
    else if (act === "read") readMenu();
    else if (act === "games") gamesMenu();
    else if (act === "glist") gameList(v || GM.g);
    else if (act === "gplay") gPlay(parseInt(v, 10));
    else if (act === "mz") { mazeMove(parseInt(v, 10)); scroll = false; }
    else if (act === "dft") { diffTap(parseInt(v, 10)); scroll = false; }
    else if (act === "dfhint") { diffHint(); scroll = false; }
    else if (act === "dot") { dotTap(parseInt(v, 10)); scroll = false; }
    else if (act === "dothint") { DT.msg = "Số " + (DT.next + 1) + " là chấm đậm màu đen."; dotDraw(); scroll = false; }
    else if (act === "fobj") { findTap(parseInt(v, 10)); scroll = false; }
    else if (act === "fhint") { findHint(); scroll = false; }
    else if (act === "story") { RD.k = parseInt(v, 10); RD.pg = 0; storyPage(); }
    else if (act === "pgnext") { RD.pg++; storyPage(); }
    else if (act === "pgprev") { RD.pg--; storyPage(); }
    else if (act === "rdq") { RD.qi = 0; RD.score = 0; RD.pick = -1; RD.opts = []; storyQ(); }
    else if (act === "rdans") { if (RD.pick < 0) { RD.pick = parseInt(v, 10); if (RD.pick === 1) RD.score++; storyQ(); } scroll = false; }
    else if (act === "rdnext") { RD.qi++; RD.pick = -1; RD.opts = []; if (RD.qi < STORIES[RD.k].q.length) storyQ(); else storyEnd(); }
    else if (act === "notes") { NT.list = null; NT.msg = ""; NT.arm = -1; notesScreen(); }
    else if (act === "addnote") addNote();
    else if (act === "delnote") { delNote(parseInt(v, 10)); scroll = false; }
    else if (act === "photos") { if (S.mode !== "photo1") { PH.list = null; PH.last = null; } PH.msg = ""; photos(); }
    else if (act === "photo") { viewPhoto(parseInt(v, 10)); }
    else if (act === "undophoto") { undoPhoto(b); scroll = false; }
    else if (act === "zoomph") { PH.zoom = !PH.zoom; previewPhoto(); scroll = false; }
    else if (act === "rotph") { PH.base = toCanvas(PH.base, 2400, 90); PH.crop = { x: 0, y: 0, w: 1, h: 1 }; cropScreen(); scroll = false; }
    else if (act === "cropall") { PH.crop = { x: 0, y: 0, w: 1, h: 1 }; placeCrop(); scroll = false; }
    else if (act === "cropdone") cropDone();
    else if (act === "recrop") { if (PH.base) cropScreen(); }
    else if (act === "savephoto") savePending();
    else if (act === "cancelph") { PH.pending = null; PH.base = null; photos("Đã huỷ, ảnh không được lưu."); }
    else if (act === "keepphoto") { PH.last = null; PH.msg = ""; photos(); }
    else if (act === "delphoto") { delPhoto(b); scroll = false; }
    else if (act === "fight") fight(parseInt(v, 10));
    else if (act === "bnext") battleNext();
    else if (act === "restore") restore();
    else if (act === "restore2") restore2();
    else if (act === "map") map();
    else if (act === "pet") pet();
    else if (act === "feed") { feed(); setTimeout(function () { petWiggle(true); }, 300); }
    else if (act === "poke") { petWiggle(true); scroll = false; }
    else if (act === "album") album();
    else if (act === "free") freeMenu();
    else if (act === "free1") startFree(v, parseInt(b.getAttribute("data-l"), 10));
    else if (act === "again") startFree(S.subj, S.lvl);
    else if (act === "stage") startStage(parseInt(v, 10));
    else if (act === "opt") {
      if (S.chosen >= 0) return;
      if (S.mode === "battle") { battleAnswer(parseInt(v, 10)); scroll = false; }
      else { S.chosen = parseInt(v, 10); answered(S.chosen === S.qs[S.i].ans); showQ(); scroll = false; }
    } else if (act === "tile") {
      q = S.qs[S.i]; q.built.push(parseInt(v, 10));
      if (q.built.length === q.tiles.length) {
        built = ""; for (i = 0; i < q.built.length; i++) built += q.tiles[q.built[i]];
        answered(built === q.word);
      }
      showXep(); scroll = false;
    } else if (act === "undo") { S.qs[S.i].built.pop(); showXep(); scroll = false; }
    else if (act === "next") next();
    else if (act === "card") { tapCard(parseInt(v, 10)); scroll = false; }
    else if (act === "cardsdone") {
      var m = S.moves; stageResult(0, 0, m <= 10 ? 3 : 2, 6);
    }
    if (scroll) window.scrollTo(0, 0);
  };
  app.onchange = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && el.id === "cam" && !el._b && el.files && el.files[0]) uploadFile(el.files[0]);
  };
  app.onkeyup = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && (el.id === "nm" || el.id === "dd" || el.id === "mm" || el.id === "yy") && (ev.keyCode === 13 || ev.which === 13)) setName();
    if (el && el.id === "code" && (ev.keyCode === 13 || ev.which === 13)) restore();
  };
  window.__lop1 = { getS: function () { return S; }, PH: PH, papi: papi, MON: MON, monSVG: monSVG, makeCode: makeCode, readCode: readCode, getP: function () { return P; },  mathQ: mathQ, tvQ: tvQ, tvDS: tvDS, mathDS: mathDS, ochuQ: ochuQ, xepQ: xepQ, pairsFor: pairsFor, AW: AW, analyze: analyze, withTone: withTone, STAGES: STAGES, genQ: genQ, petSVG: petSVG };
  loadPetCfg();
  var last = lsGet("lop1_last");
  if (last && has(players(), last) && (!ONLINE || pins()[last])) doLogin(last, pins()[last]); else nameScreen();
})();
</script>
</body>
</html>
