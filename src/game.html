<style>
/* Thiết kế cho Kindle: đen trắng, chữ to, nút lớn, không có hiệu ứng chuyển động. */
/*FONTS*/
html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body { font-family: "VNSans", "DejaVu Sans", sans-serif; font-size: 24px; line-height: 1.35; }
#app { max-width: 900px; margin: 0 auto; padding: 14px 16px 40px; }
h1 { font-size: 42px; margin: 8px 0 6px; text-align: center; }
h2 { font-size: 30px; margin: 16px 0 10px; text-align: center; }
p.sub { text-align: center; margin: 0 0 16px; font-size: 22px; }
.btn { display: block; width: 100%; box-sizing: border-box; -webkit-box-sizing: border-box;
  margin: 0 0 14px; padding: 16px 8px; min-height: 80px; font-size: 30px; font-family: "VNSans", "DejaVu Sans", sans-serif;
  font-weight: bold; color: #000; background: #fff; border: 4px solid #000; border-radius: 14px;
  text-align: center; cursor: pointer; -webkit-appearance: none; }
.btn.dark { background: #000; color: #fff; }
.btn.small { display: inline-block; width: auto; min-height: 0; padding: 8px 16px; font-size: 22px; margin: 0; border-width: 3px; }
.btn.right, .btn.done { background: #000; color: #fff; }
.btn.wrong { background: #bbb; text-decoration: line-through; border-style: dashed; }

.top { overflow: hidden; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 14px; }

.dots { font-size: 44px; letter-spacing: 8px; line-height: 1.2; }
.fb { font-size: 32px; text-align: center; font-weight: bold; margin: 16px 0; min-height: 42px; }
.score { font-size: 76px; text-align: center; font-weight: bold; margin: 6px 0; }
.stars { font-size: 60px; text-align: center; letter-spacing: 8px; }
.note { font-size: 20px; text-align: center; margin: 10px 0; }
.box { display: inline-block; border: 4px solid #000; min-width: 60px; padding: 0 8px; }
.cell { display: inline-block; border: 4px solid #000; min-width: 64px; height: 76px; line-height: 76px;
  font-size: 50px; font-weight: bold; margin: 3px; text-align: center; vertical-align: middle; }

.tiles .btn { display: inline-block; width: 22%; margin: 1%; font-size: 46px; min-height: 96px; }

  border: 4px solid #000; border-radius: 14px; margin: 0 0 14px; font-family: "VNSans", "DejaVu Sans", sans-serif; background: #fff; color: #000;  text-transform: capitalize; }

<body>
<div id="app">Đang tải...</div>
<script>
(function () {
  // ================= TIỆN ÍCH =================
  function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function has(arr, x) { for (var i = 0; i < arr.length; i++) { if (arr[i] === x) return true; } return false; }
  function mk(text, ans, wrongs, keepOrder) {
    var opts = [String(ans)], i;
    for (i = 0; i < wrongs.length && opts.length < 4; i++) {
      if (!has(opts, String(wrongs[i]))) opts.push(String(wrongs[i]));
    }
    if (!keepOrder) opts = shuffle(opts);
    for (i = 0; i < opts.length; i++) { if (opts[i] === String(ans)) break; }
    return { kind: "mc", text: text, opts: opts, ans: i };
  }
  function yesNo(text, truth) { return { kind: "mc", text: text, opts: ["Đúng", "Sai"], ans: truth ? 0 : 1 }; }
  function nearNums(n, lo, hi) {
    var out = [], tries = 0, d, c;
    while (out.length < 3 && tries < 60) {
      tries++;
      d = rand(1, 3) * (Math.random() < 0.5 ? -1 : 1);
      if (hi > 30 && Math.random() < 0.3) d = d * 10;
      c = n + d;
      if (c >= lo && c <= hi && c !== n && !has(out, c)) out.push(c);
    }
    c = lo;
    while (out.length < 3) { if (c !== n && !has(out, c)) out.push(c); c++; }
    return out;
  }
  function wrongNum(r) { var w = r + pick([-2, -1, 1, 2]); return w < 0 ? r + 1 : w; }

  // ================= TOÁN =================
  var STORIES_ADD = [
    "Lan có {a} quả cam, mẹ cho thêm {b} quả. Hỏi Lan có tất cả mấy quả cam?",
    "Tổ Một có {a} bạn, tổ Hai có {b} bạn. Hỏi cả hai tổ có mấy bạn?",
    "Trong ao có {a} con vịt, có thêm {b} con xuống ao. Hỏi trong ao có tất cả mấy con vịt?",
    "Bé có {a} viên bi, anh cho bé thêm {b} viên. Hỏi bé có tất cả mấy viên bi?",
    "Vườn nhà Nam có {a} cây cam và {b} cây bưởi. Hỏi vườn có tất cả mấy cây?"
  ];
  var STORIES_SUB = [
    "Trên cành có {a} con chim, {b} con bay đi. Hỏi trên cành còn lại mấy con chim?",
    "Bé có {a} cái kẹo, bé cho em {b} cái. Hỏi bé còn lại mấy cái kẹo?",
    "Hộp có {a} cái bút, Nam lấy ra {b} cái. Hỏi trong hộp còn mấy cái bút?",
    "Đàn gà có {a} con, {b} con chạy vào chuồng. Hỏi ngoài sân còn mấy con gà?",
    "Mẹ mua {a} quả trứng, đã luộc {b} quả. Hỏi còn mấy quả trứng chưa luộc?"
  ];
  function addPair(M) {
    var a, b;
    for (;;) {
      if (M <= 10) { a = rand(0, 10); b = rand(0, 10 - a); }
      else if (M <= 20) { a = rand(0, 20); b = rand(0, 20 - a); }
      else { a = rand(10, 89); b = rand(1, 99 - a); if (a % 10 + b % 10 > 9) continue; }
      if (a + b > 0) return [a, b];
    }
  }
  function subPair(M) {
    var a, b;
    for (;;) {
      a = rand(M <= 10 ? 1 : (M <= 20 ? 5 : 10), M > 20 ? 99 : M);
      b = rand(0, a);
      if (M > 20 && a % 10 < b % 10) continue;
      return [a, b];
    }
  }
  function mathQ(M) {
    var hi = M > 20 ? 99 : M;
    var type = pick(["add", "add", "sub", "sub", "cmp", "count", "next", "miss", "max", "story", "seq"]);
    var p, a, b, n, s, nums, i, step, start;
    if (type === "add") {
      p = addPair(M);
      return mk('<span class="big">' + p[0] + " + " + p[1] + " = ?</span>", p[0] + p[1], nearNums(p[0] + p[1], 0, hi));
    }
    if (type === "sub") {
      p = subPair(M);
      return mk('<span class="big">' + p[0] + " − " + p[1] + " = ?</span>", p[0] - p[1], nearNums(p[0] - p[1], 0, hi));
    }
    if (type === "cmp") {
      a = rand(0, hi); b = Math.random() < 0.2 ? a : rand(0, hi);
      return mk('Điền dấu thích hợp:<br><span class="big">' + a + ' <span class="box">?</span> ' + b + "</span>",
        a > b ? "&gt;" : (a < b ? "&lt;" : "="), ["&gt;", "&lt;", "="].sort(), true);
    }
    if (type === "count") {
      n = rand(1, M <= 10 ? 10 : 20); s = "";
      for (i = 1; i <= n; i++) { s += "●"; if (i % 5 === 0 && i < n) s += (i % 10 === 0 ? "<br>" : " &nbsp; "); }
      return mk('Có bao nhiêu chấm tròn?<br><span class="dots">' + s + "</span>", n, nearNums(n, 1, 20));
    }
    if (type === "next") {
      n = rand(1, hi - 1);
      if (Math.random() < 0.5) return mk("Số liền sau của <b>" + n + "</b> là số nào?", n + 1, [n - 1, n + 2, n + 10 <= hi ? n + 10 : n]);
      return mk("Số liền trước của <b>" + n + "</b> là số nào?", n - 1, [n + 1, n - 2 >= 0 ? n - 2 : n + 2, n]);
    }
    if (type === "miss") {
      p = addPair(M);
      if (Math.random() < 0.5) return mk('<span class="big">' + p[0] + ' + <span class="box">?</span> = ' + (p[0] + p[1]) + "</span>", p[1], nearNums(p[1], 0, hi));
      return mk('<span class="big"><span class="box">?</span> + ' + p[1] + " = " + (p[0] + p[1]) + "</span>", p[0], nearNums(p[0], 0, hi));
    }
    if (type === "max") {
      nums = [];
      while (nums.length < 4) { n = rand(0, hi); if (!has(nums, n)) nums.push(n); }
      var big = Math.random() < 0.5, best = nums[0];
      for (i = 1; i < 4; i++) { if (big ? nums[i] > best : nums[i] < best) best = nums[i]; }
      var wr = []; for (i = 0; i < 4; i++) { if (nums[i] !== best) wr.push(nums[i]); }
      return mk("Số nào <b>" + (big ? "lớn nhất" : "bé nhất") + "</b>?", best, wr);
    }
    if (type === "story") {
      if (Math.random() < 0.5) {
        p = addPair(M);
        if (p[0] === 0 || p[1] === 0) p = [p[0] + 1, p[1] + 1];
        s = pick(STORIES_ADD).replace("{a}", p[0]).replace("{b}", p[1]); n = p[0] + p[1];
      } else {
        p = subPair(M);
        if (p[1] === 0) p[1] = 1;
        if (p[1] > p[0]) p[0] = p[1];
        s = pick(STORIES_SUB).replace("{a}", p[0]).replace("{b}", p[1]); n = p[0] - p[1];
      }
      return mk('<div class="story">' + s + "</div>", n, nearNums(n, 0, Math.max(hi, n + 3)));
    }
    step = M > 20 ? pick([1, 2, 10]) : (M > 10 ? pick([1, 2]) : 1);
    start = rand(0, hi - step * 4);
    if (step === 10) start = rand(0, 5) * 10;
    var miss = rand(1, 4), seq = [];
    for (i = 0; i < 5; i++) seq.push(i === miss ? '<span class="box">?</span>' : String(start + i * step));
    n = start + miss * step;
    return mk("Điền số còn thiếu:<br><span class=\"big\">" + seq.join(", ") + "</span>", n, [n + 1, n - 1, n + step + 1 <= hi ? n + step : n + 2]);
  }
  function mathDS(M) {
    var hi = M > 20 ? 99 : M, truth = Math.random() < 0.5, p, r, a, b, real, k = pick(["add", "add", "sub", "sub", "cmp"]);
    var pre = "Đúng hay sai?<br>";
    if (k === "add") { p = addPair(M); r = p[0] + p[1]; return yesNo(pre + '<span class="big">' + p[0] + " + " + p[1] + " = " + (truth ? r : wrongNum(r)) + "</span>", truth); }
    if (k === "sub") { p = subPair(M); r = p[0] - p[1]; return yesNo(pre + '<span class="big">' + p[0] + " − " + p[1] + " = " + (truth ? r : wrongNum(r)) + "</span>", truth); }
    a = rand(0, hi); b = Math.random() < 0.2 ? a : rand(0, hi);
    real = a > b ? "&gt;" : (a < b ? "&lt;" : "=");
    var shown = truth ? real : pick(["&gt;", "&lt;", "="].filter(function (x) { return x !== real; }));
    return yesNo(pre + '<span class="big">' + a + " " + shown + " " + b + "</span>", truth);
  }

  // ================= TIẾNG VIỆT =================
  var V = { a: "aàáảãạ", "ă": "ăằắẳẵặ", "â": "âầấẩẫậ", e: "eèéẻẽẹ", "ê": "êềếểễệ", i: "iìíỉĩị",
    o: "oòóỏõọ", "ô": "ôồốổỗộ", "ơ": "ơờớởỡợ", u: "uùúủũụ", "ư": "ưừứửữự", y: "yỳýỷỹỵ" };
  var TONE = ["không dấu", "dấu huyền", "dấu sắc", "dấu hỏi", "dấu ngã", "dấu nặng"];
  var LOOK = {}, k, t;
  for (k in V) { if (V.hasOwnProperty(k)) { for (t = 0; t < 6; t++) LOOK[V[k].charAt(t)] = { b: k, t: t }; } }
  var ONSETS = ["ngh", "ng", "gh", "nh", "ch", "th", "kh", "ph", "tr", "gi", "qu", "b", "c", "d", "đ", "g", "h", "k", "l", "m", "n", "p", "r", "s", "t", "v", "x"];
  var WORDS = ("ba bà bé bố mẹ cá gà hổ nhà xe đỏ cờ lá hoa mèo chó bò dê thỏ cây quả lê mía bút vở bàn ghế đèn mũ áo dép nón " +
    "khế cua ốc tôm cò vịt ngựa voi kẹo kem kéo kiến gỗ ghẹ ngõ nghé nghỉ quạt sao trăng mưa gió nắng cơm canh rau sữa trứng " +
    "chuối cam bưởi na ổi mít lửa núi sông cỏ cũ tủ mỏ chè phố thư rổ").split(" ");
  // Từ + gợi ý cho trò Xếp chữ và Ô chữ
  var CLUES = [
    ["mèo", "Con vật kêu meo meo"], ["chó", "Con vật trông nhà, sủa gâu gâu"], ["gà", "Con vật gáy ò ó o"],
    ["cá", "Con vật bơi dưới nước"], ["bò", "Con vật ăn cỏ, kêu ụm bò"], ["voi", "Con vật to, có vòi dài"],
    ["thỏ", "Con vật tai dài, thích ăn cà rốt"], ["vịt", "Con vật kêu cạp cạp"], ["tôm", "Con vật dưới nước, có râu dài"],
    ["ngựa", "Con vật chạy rất nhanh, có bờm"], ["hoa", "Nở trong vườn, có nhiều màu đẹp"], ["bút", "Đồ dùng để viết"],
    ["vở", "Bé viết bài vào đây"], ["ghế", "Đồ dùng để ngồi"], ["bàn", "Bé đặt sách vở lên đây để học"],
    ["mũ", "Đội trên đầu khi trời nắng"], ["dép", "Mang ở chân khi đi"], ["mẹ", "Người sinh ra bé"],
    ["bà", "Mẹ của bố hoặc của mẹ"], ["nhà", "Nơi cả gia đình cùng ở"], ["trăng", "Sáng trên trời ban đêm"],
    ["mưa", "Nước rơi từ trên trời xuống"], ["cam", "Quả tròn, vị ngọt chua"], ["chuối", "Quả dài, chín có màu vàng"],
    ["sữa", "Bé uống để mau lớn"], ["cơm", "Nấu từ gạo, ăn mỗi ngày"], ["lửa", "Nóng, cháy bập bùng"],
    ["sông", "Dòng nước chảy dài"], ["núi", "Cao hơn đồi rất nhiều"], ["gió", "Thổi làm lá cây đung đưa"],
    ["kéo", "Đồ dùng để cắt giấy"], ["sao", "Lấp lánh trên trời đêm"], ["kem", "Món ăn lạnh, ngọt"],
    ["ổi", "Quả xanh, ruột có nhiều hạt"], ["cỏ", "Bò và dê thích ăn thứ này"], ["đèn", "Bật lên cho sáng"]
  ];
  for (k = 0; k < CLUES.length; k++) { if (!has(WORDS, CLUES[k][0])) WORDS.push(CLUES[k][0]); }

  function placeTone(p, s) {
    var vs = [], i, res = -1;
    for (i = s; i < p.length; i++) { if (V[p.charAt(i)]) vs.push(i); }
    if (!vs.length) return -1;
    for (i = 0; i < vs.length; i++) { if ("ăâêôơư".indexOf(p.charAt(vs[i])) >= 0) res = vs[i]; }
    if (res >= 0) return res;
    var last = vs[vs.length - 1];
    if (vs.length === 1 || last < p.length - 1) return last;
    var g = p.substring(vs[0], last + 1);
    if (g === "oa" || g === "oe" || g === "uy") return vs[1];
    if (vs.length === 3) return vs[1];
    return vs[0];
  }
  function analyze(w) {
    var plain = "", tone = 0, pos = -1, i, ch, L, on = "";
    for (i = 0; i < w.length; i++) {
      ch = w.charAt(i); L = LOOK[ch];
      if (L) { plain += L.b; if (L.t > 0) { tone = L.t; pos = i; } } else plain += ch;
    }
    for (i = 0; i < ONSETS.length; i++) {
      if (plain.indexOf(ONSETS[i]) === 0 && plain.length > ONSETS[i].length && V[plain.charAt(ONSETS[i].length)]) { on = ONSETS[i]; break; }
    }
    if (pos < 0) pos = placeTone(plain, on.length);
    return { w: w, plain: plain, on: on, rime: plain.substr(on.length), tone: tone, pos: pos };
  }
  function withTone(a, tn) {
    var p = a.plain, ch = p.charAt(a.pos);
    return p.substr(0, a.pos) + V[ch].charAt(tn) + p.substr(a.pos + 1);
  }
  var AW = []; for (k = 0; k < WORDS.length; k++) AW.push(analyze(WORDS[k]));
  function otherVals(field, not) {
    var out = [], i, v;
    for (i = 0; i < AW.length; i++) { v = AW[i][field]; if (v && v !== not && !has(out, v)) out.push(v); }
    return shuffle(out);
  }
  var SWAP = { c: "k", k: "c", g: "gh", gh: "g", ng: "ngh", ngh: "ng" };
  var SENT = [
    ["Bé đá ___.", "bóng", ["mưa", "gió", "cơm"]],
    ["Con mèo kêu ___.", "meo meo", ["gâu gâu", "ò ó o", "cạp cạp"]],
    ["Con chó sủa ___.", "gâu gâu", ["meo meo", "ò ó o", "ụt ịt"]],
    ["Gà trống gáy ___.", "ò ó o", ["meo meo", "gâu gâu", "cạp cạp"]],
    ["Lá cây có màu ___.", "xanh", ["tím", "đen", "hồng"]],
    ["Con cá bơi dưới ___.", "nước", ["cây", "mây", "bàn"]],
    ["Chim bay trên ___.", "trời", ["nước", "đất", "bàn"]],
    ["Bé dùng ___ để viết bài.", "bút", ["dép", "mũ", "bát"]],
    ["Bé dùng ___ để ăn cơm.", "đũa", ["bút", "giày", "lược"]],
    ["Con ___ có cái vòi dài.", "voi", ["mèo", "gà", "cá"]],
    ["Con thỏ thích ăn ___.", "cà rốt", ["xương", "cá", "thóc"]],
    ["Quả chanh có vị ___.", "chua", ["ngọt", "mặn", "cay"]],
    ["Đường có vị ___.", "ngọt", ["chua", "mặn", "đắng"]],
    ["Muối có vị ___.", "mặn", ["ngọt", "chua", "nhạt"]],
    ["Buổi tối, bé đi ___.", "ngủ", ["bơi", "bay", "đá"]],
    ["Mặt trời mọc ở đằng ___.", "đông", ["tây", "nam", "bắc"]],
    ["Bé đi học ở ___.", "trường", ["chợ", "bếp", "ao"]],
    ["Mùa hè trời ___.", "nóng", ["lạnh", "tối", "mặn"]],
    ["Bà kể ___ cho bé nghe.", "chuyện", ["cơm", "nhà", "bút"]],
    ["Bé ___ tay trước khi ăn.", "rửa", ["đá", "ngủ", "hát"]]
  ];
  function big(w) { return '<span class="big">' + w + "</span>"; }
  function pickA(cond) { var a; do { a = pick(AW); } while (!cond(a)); return a; }
  function tvQ(lv) {

      if (i > 0 && i % 3 === 0) h += "</tr><tr>";
      cls = c.done ? "btn done" : (c.open ? "btn" : "btn off");
      h += '<td><button class="' + cls + '" data-act="card" data-v="' + i + '">' + (c.open || c.done ? c.t : "?") + "</button></td>";
    }
    h += "</tr></table>";
    if (!left) h += '<div class="fb">Tìm hết rồi! Giỏi quá!</div><button class="btn dark" data-act="cardsdone">Xem kết quả</button>';
    else if (S.flip.length === 2) h += '<div class="fb">Chưa khớp, thử lại nhé.</div>';
    app.innerHTML = h;
  }
  function tapCard(i) {
    var c = S.cards[i], a, b;
    if (c.done || c.open) return;
    if (S.flip.length === 2) { S.cards[S.flip[0]].open = false; S.cards[S.flip[1]].open = false; S.flip = []; }
    c.open = true; S.flip.push(i);
    if (S.flip.length === 2) {
      S.moves++;
      a = S.cards[S.flip[0]]; b = S.cards[S.flip[1]];
      if (a.p === b.p) { a.done = b.done = true; a.open = b.open = false; S.flip = []; }
    }
    showCards();
  }
  function stageResult(correct, total, stars, earned) {
    var i = S.stage, prev = P.st[i], h, newStk = false, msg;
    P.seeds += earned;
    if (stars > prev) P.st[i] = stars;
    if (stars === 3 && !P.stk[i]) { P.stk[i] = 1; newStk = true; }
    save();
    if (stars === 3) msg = "Xuất sắc!"; else if (stars === 2) msg = "Giỏi lắm! Qua chặng rồi!"; else if (stars === 1) msg = "Hoàn thành! Thử lại để được 3 sao nhé!";
    else msg = "Chưa qua chặng. Cần đúng 4 câu, mình thử lại nhé!";
    msg = nameMsg(msg);
    h = "<h1>Chặng " + (i + 1) + "</h1>";
    h += total ? '<div class="score">' + correct + "/" + total + "</div>" : '<div class="score">' + S.moves + " lượt</div>";
    h += '<div class="stars">' + starStr(stars) + "</div><h2>" + msg + "</h2>";
    h += '<p class="sub">Nhận được <b>' + earned + " hạt thóc</b>. Đang có " + P.seeds + " hạt.</p>";
    if (newStk) h += '<div class="pick"><h2>Nhãn dán mới!</h2><div class="gift">' + STICKERS[i][0] + '</div><p class="sub">' + STICKERS[i][1] + "</p></div>";
    if (stars >= 2 && prev < 2 && i + 1 < STAGES.length) h += '<p class="sub"><b>Đã mở khoá chặng ' + (i + 2) + "!</b></p>";
    if (stars >= 2 && i + 1 < STAGES.length) h += '<button class="btn dark" data-act="stage" data-v="' + (i + 1) + '">Chặng tiếp theo</button>';
    h += '<table class="g"><tr><td><button class="btn" data-act="stage" data-v="' + i + '">Chơi lại</button></td>' +
      '<td><button class="btn" data-act="map">Bản đồ</button></td></tr></table>';
    if (P.seeds >= 5) h += '<button class="btn" data-act="pet">Cho gà ăn</button>';
    app.innerHTML = h;
  }
  function nameMsg(m) { var i = m.indexOf("!"); return i < 0 ? m + ", " + nm() : m.substr(0, i) + ", " + nm() + m.substr(i); }
  // ================= SAO LƯU =================
  var B32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function pushBits(arr, v, n) { for (var i = n - 1; i >= 0; i--) arr.push(Math.floor(v / Math.pow(2, i)) % 2); }
  function readBits(arr, pos, n) { var v = 0; for (var i = 0; i < n; i++) v = v * 2 + arr[pos + i]; return v; }
  function sumBits(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s = (s * 33 + arr[i] + 7) % 509; return s; }
  function makeCode() {
    var b = [], i, out = "";
    for (i = 0; i < STAGES.length; i++) pushBits(b, P.st[i] || 0, 2);
    pushBits(b, Math.min(P.seeds, 65535), 16);
    pushBits(b, Math.min(P.fed, 1023), 10);
    pushBits(b, sumBits(b), 9);
    for (i = 0; i < b.length; i += 5) { out += B32.charAt(readBits(b, i, 5)); if (i + 5 < b.length && (i / 5) % 5 === 4) out += "-"; }
    return out;
  }
  function readCode(s) {
    var c = String(s).toUpperCase().replace(/[^A-Z0-9]/g, ""), b = [], i, v, r;
    if (c.length !== 15) return null;
    for (i = 0; i < c.length; i++) { v = B32.indexOf(c.charAt(i)); if (v < 0) return null; pushBits(b, v, 5); }
    if (sumBits(b.slice(0, 66)) !== readBits(b, 66, 9)) return null;
    r = { st: [], seeds: readBits(b, 40, 16), fed: readBits(b, 56, 10), stk: {} };
    for (i = 0; i < STAGES.length; i++) { r.st.push(readBits(b, i * 2, 2)); if (r.st[i] === 3) r.stk[i] = 1; }
    return r;
  }
  var PENDING = null;
  function backup(msg) {
    S.mode = ""; PENDING = null;
    var h = topBar("Sao lưu") + "<h1>Sao lưu của " + nm() + "</h1>" +
      '<p class="sub">Ghi lại mã này. Khi đổi máy hoặc lỡ mất dữ liệu, nhập mã để lấy lại sao, hạt thóc, con gà và nhãn dán.</p>' +
      '<div class="pick"><div class="code">' + makeCode() + '</div><p class="note">Sao: ' + totalStars() + " · Hạt thóc: " + P.seeds +
      " · Đã cho gà ăn: " + P.fed + " lần</p></div>" +
      "<h2>Khôi phục từ mã</h2>" +
      '<input id="code" class="inp code-in" type="text" maxlength="20" placeholder="Nhập mã sao lưu" autocomplete="off">';
    if (msg) h += '<p class="fb">' + msg + "</p>";
    h += '<button class="btn dark" data-act="restore">Kiểm tra mã</button>';
    app.innerHTML = h;
  }
  function restore() {
    var el = document.getElementById("code"), r = readCode(el && el.value ? el.value : ""), s = 0, i;
    if (!r) { backup("Mã chưa đúng, bạn kiểm tra lại nhé."); return; }
    PENDING = r;
    for (i = 0; i < r.st.length; i++) s += r.st[i];
    app.innerHTML = topBar("Sao lưu") + "<h1>Mã đúng!</h1>" +
      '<p class="sub">Tiến trình hiện tại của <b>' + nm() + "</b> sẽ được thay bằng:</p>" +
      '<div class="pick"><p class="stat">Sao: <b>' + s + "</b> · Hạt thóc: <b>" + r.seeds + "</b> · Cho ăn: <b>" + r.fed + " lần</b></p>" +
      '<div class="pet">' + petSVGFed(r.fed) + "</div></div>" +
      '<button class="btn dark" data-act="restore2">Khôi phục</button><button class="btn" data-act="backup">Huỷ</button>';
  }
  function petSVGFed(f) { var l = 0; for (var i = 0; i < PET_LV.length; i++) { if (f >= PET_LV[i]) l = i; } return petSVG(l, 150); }
  function restore2() {
    if (!PENDING) { backup(); return; }
    P = PENDING; PENDING = null; save();
    home();
  }
  function freeMenu() {
    S.mode = "";
    app.innerHTML = topBar("Luyện tập tự do · 10 câu mỗi lượt") +
      '<div class="pick"><h2>Toán</h2>' +
      '<button class="btn" data-act="free1" data-v="toan" data-l="10">Trong phạm vi 10</button>' +
      '<button class="btn" data-act="free1" data-v="toan" data-l="20">Trong phạm vi 20</button>' +
      '<button class="btn" data-act="free1" data-v="toan" data-l="100">Trong phạm vi 100</button></div>' +
      '<div class="pick"><h2>Tiếng Việt</h2>' +
      '<button class="btn" data-act="free1" data-v="tv" data-l="0">Âm, vần, dấu, chính tả</button></div>' +
      '<button class="btn dark" data-act="free1" data-v="tron" data-l="10">Trộn cả hai môn</button>';
  }
  function freeResult() {
    var n = S.qs.length, stars = S.score === n ? 3 : (S.score >= 7 ? 2 : (S.score >= 4 ? 1 : 0)), msg;
    P.seeds += S.score; save();
    msg = S.score === n ? "Xuất sắc! Đúng hết tất cả!" : (S.score >= 7 ? "Giỏi lắm! Cố thêm chút nữa nhé!" :
      (S.score >= 4 ? "Khá rồi! Chơi lại để giỏi hơn nhé!" : "Không sao, mình cùng luyện lại nhé!"));
    msg = nameMsg(msg);
    app.innerHTML = "<h1>Kết quả</h1><div class=\"score\">" + S.score + "/" + n + "</div><div class=\"stars\">" + starStr(stars) + "</div>" +
      "<h2>" + msg + '</h2><p class="sub">Nhận được <b>' + S.score + " hạt thóc</b>. Đang có " + P.seeds + " hạt.</p>" +
      '<button class="btn dark" data-act="again">Chơi lại</button>' +
      '<table class="g"><tr><td><button class="btn" data-act="pet">Cho gà ăn</button></td><td><button class="btn" data-act="home">Trang chủ</button></td></tr></table>';
  }
  function pet(msg) {
    S.mode = "";
    var l = petLevel(), h, need;
    h = topBar("Hạt thóc: " + P.seeds) + "<h1>" + PET_NAME[l] + '</h1><p class="sub">Gà của bé <b>' + nm() + '</b></p><div class="pet">' + petSVG(l, 300) + "</div>";
    if (msg) h += '<div class="fb">' + msg + "</div>";
    if (l < PET_LV.length - 1) { need = PET_LV[l + 1] - P.fed; h += '<p class="sub">Cho ăn thêm <b>' + need + " lần</b> nữa để " + (l === 0 ? "trứng nở" : "gà lớn lên") + ".</p>"; }
    else h += '<p class="sub">Gà đã lớn nhất rồi! Đã cho ăn ' + P.fed + " lần.</p>";
    h += P.seeds >= 5 ? '<button class="btn dark" data-act="feed">Cho ăn (5 hạt thóc)</button>' :
      '<button class="btn off">Cần 5 hạt thóc để cho ăn</button><p class="note">Trả lời đúng mỗi câu được 1 hạt thóc.</p>';
    h += '<button class="btn" data-act="map">Đi kiếm thóc trên bản đồ</button>';
    app.innerHTML = h;
  }
  function feed() {
    if (P.seeds < 5) { pet(); return; }
    var before = petLevel();
    P.seeds -= 5; P.fed++; save();
    var after = petLevel();
    pet(after > before ? "Wow! " + PET_NAME[before] + " đã thành " + PET_NAME[after] + "!" : pick(["Ngon quá! Cảm ơn bé!", "Chíp chíp, no bụng rồi!", "Ăn ngon lành!"]));
  }
  function album() {
    S.mode = "";
    var h = topBar("Nhãn dán: " + stickerCount() + "/" + STICKERS.length) + "<h1>Album của " + nm() + "</h1>" +
      '<p class="sub">Đạt 3 sao ở mỗi chặng để nhận một nhãn dán.</p><table class="g"><tr>', i;
    for (i = 0; i < STICKERS.length; i++) {
      if (i > 0 && i % 4 === 0) h += "</tr><tr>";
      h += P.stk[i] ? '<td><div class="stk"><b>' + STICKERS[i][0] + "</b><span>" + STICKERS[i][1] + "</span></div></td>" :
        '<td><div class="stk no"><b>?</b><span>Chặng ' + (i + 1) + "</span></div></td>";
    }
    app.innerHTML = h + "</tr></table>";
  }
  function answered(ok) { if (ok) S.score++; }
  function next() {
    S.chosen = -1; S.i++;
    if (S.i < S.qs.length) { showQ(); return; }
    if (S.mode === "map") { var c = S.score; stageResult(c, S.qs.length, c === 5 ? 3 : (c === 4 ? 2 : 0), c); }
    else freeResult();
  }

  // ================= XỬ LÝ CHẠM =================
  function findBtn(el) {
    while (el && el !== app) { if (el.tagName === "BUTTON") return el; el = el.parentNode; }
    return null;
  }
  app.onclick = function (ev) {
    ev = ev || window.event;
    var b = findBtn(ev.target || ev.srcElement), act, v, q, built, i;
    if (!b) return;
    act = b.getAttribute("data-act"); v = b.getAttribute("data-v");
    if (!act) return;
    var scroll = true;
    if (act === "home") home();
    else if (act === "who0") nameScreen();
    else if (act === "who") { loadPlayer(players()[parseInt(v, 10)]); home(); }
    else if (act === "setname") setName();
    else if (act === "backup") backup();
    else if (act === "restore") restore();
    else if (act === "restore2") restore2();
    else if (act === "map") map();
    else if (act === "pet") pet();
    else if (act === "feed") feed();
    else if (act === "album") album();
    else if (act === "free") freeMenu();
    else if (act === "free1") startFree(v, parseInt(b.getAttribute("data-l"), 10));
    else if (act === "again") startFree(S.subj, S.lvl);
    else if (act === "stage") startStage(parseInt(v, 10));
    else if (act === "opt") {
      if (S.chosen >= 0) return;
      S.chosen = parseInt(v, 10); answered(S.chosen === S.qs[S.i].ans); showQ(); scroll = false;
    } else if (act === "tile") {
      q = S.qs[S.i]; q.built.push(parseInt(v, 10));
      if (q.built.length === q.tiles.length) {
        built = ""; for (i = 0; i < q.built.length; i++) built += q.tiles[q.built[i]];
        answered(built === q.word);
      }
      showXep(); scroll = false;
    } else if (act === "undo") { S.qs[S.i].built.pop(); showXep(); scroll = false; }
    else if (act === "next") next();
    else if (act === "card") { tapCard(parseInt(v, 10)); scroll = false; }
    else if (act === "cardsdone") {
      var m = S.moves; stageResult(0, 0, m <= 10 ? 3 : 2, 6);
    }
    if (scroll) window.scrollTo(0, 0);
  };
  app.onkeyup = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && el.id === "nm" && (ev.keyCode === 13 || ev.which === 13)) setName();
    if (el && el.id === "code" && (ev.keyCode === 13 || ev.which === 13)) restore();
  };
  window.__lop1 = { makeCode: makeCode, readCode: readCode, getP: function () { return P; },  mathQ: mathQ, tvQ: tvQ, tvDS: tvDS, mathDS: mathDS, ochuQ: ochuQ, xepQ: xepQ, pairsFor: pairsFor, AW: AW, analyze: analyze, withTone: withTone, STAGES: STAGES, genQ: genQ, petSVG: petSVG };
  var last = lsGet("lop1_last");
  if (last && has(players(), last)) { loadPlayer(last); home(); } else nameScreen();
})();
</script>
