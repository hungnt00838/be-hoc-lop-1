        "<h2>" + nm() + " đã đánh bại " + MON[i].n + "!</h2>" +
        '<p class="sub">Trả lời đúng ' + S.got + " câu. Thưởng thêm <b>" + bonus + " hạt thóc</b>. Đang có " + P.seeds + " hạt.</p>" +
        (first && i + 1 < MON.length ? '<p class="sub"><b>Đã mở quái vật mới: ' + MON[i + 1].n + "!</b></p>" : "") +
        (first && i + 1 === MON.length ? '<p class="sub"><b>Bé đã đánh bại tất cả quái vật! Siêu anh hùng!</b></p>' : "") +
        (i + 1 < MON.length ? '<button class="btn dark" data-act="fight" data-v="' + (i + 1) + '">Đánh quái vật tiếp theo</button>' : "") +
        '<table class="g"><tr><td><button class="btn" data-act="monsters">Danh sách quái vật</button></td><td><button class="btn" data-act="pet">Cho gà ăn</button></td></tr></table>';
      return;
    }
    if (S.php <= 0) {
      save();
      app.innerHTML = "<h1>Hết trái tim rồi!</h1>" + '<div class="pic">' + heroSVG(150, "hurt") + " " + monSVG(i, 150, "") + "</div>" +
        "<h2>" + MON[i].n + " còn " + S.mhp + " máu. Mình luyện thêm rồi đánh lại nhé, " + nm() + "!</h2>" +
        '<p class="sub">Trả lời đúng ' + S.got + " câu, được " + S.got + " hạt thóc.</p>" +
        '<button class="btn dark" data-act="fight" data-v="' + i + '">Đánh lại</button><button class="btn" data-act="monsters">Danh sách quái vật</button>';
      return;
    }
    S.state = ""; battleQ(); showBattle();
  }


  // ================= ẢNH CỦA BÉ =================
  var PH = { list: null, msg: "", arm: 0 };
  function papi(body, cb) { body.name = NAME; body.pin = PIN; api(body, cb, "/api/photo"); }
  function photos(msg) {
    S.mode = "photos"; PH.arm = 0;
    if (msg !== undefined) PH.msg = msg;
    var h = topBar("Ảnh của bé") + "<h1>Ảnh của " + nm() + "</h1>", i, p;
    if (!ONLINE || !PIN) { app.innerHTML = h + '<p class="sub">Cần mở game qua trang web và đăng nhập bằng tên + ngày sinh để lưu ảnh.</p>'; return; }
    h += '<label class="btn dark filebtn">Chụp ảnh hoặc chọn ảnh<input id="cam" type="file" accept="image/*" capture="environment"></label>' +
      '<p class="note">Máy Kindle không có máy ảnh: hãy chụp bằng điện thoại hoặc máy tính bảng, đăng nhập đúng tên bé. Ảnh sẽ hiện ở đây trên mọi máy.</p>';
    if (PH.msg) h += '<div class="fb">' + PH.msg + "</div>";
    if (PH.list === null) { h += '<p class="sub">Đang tải ảnh...</p>'; app.innerHTML = h; loadPhotos(); return; }
    if (!PH.list.length) h += '<p class="sub">Chưa có ảnh nào.</p>';
    else {
      h += '<p class="sub">' + PH.list.length + ' ảnh. Chạm vào ảnh để xem lớn.</p><table class="g photos"><tr>';
      for (i = 0; i < PH.list.length; i++) {
        p = PH.list[i];
        if (i > 0 && i % 3 === 0) h += "</tr><tr>";
        h += '<td><button class="btn ph" data-act="photo" data-v="' + i + '">' + (p.thumb ? '<img src="' + p.thumb + '" alt="">' : "?") +
          '<span class="s">' + dstr(p.ts) + "</span></button></td>";
      }
      h += "</tr></table>";
    }
    app.innerHTML = h;
  }
  function dstr(ts) { var d = new Date(ts); return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear(); }
  function loadPhotos() {
    papi({ action: "list" }, function (err, r) {
      if (S.mode !== "photos") return;
      if (err) { PH.list = []; photos("Không tải được ảnh: " + err.msg); return; }
      PH.list = r.photos; photos();
    });
  }
  function viewPhoto(i) {
    var p = PH.list[i];
    if (!p) return;
    S.mode = "photo1"; PH.cur = i; PH.arm = 0;
    app.innerHTML = topBar("Xem ảnh") + '<div class="pic">' + (p.thumb ? '<img class="big1" id="bigimg" src="' + p.thumb + '" alt="">' : "") + "</div>" +
      '<p class="sub">Chụp ngày ' + dstr(p.ts) + ' · <span id="ldmsg">Đang tải ảnh rõ nét...</span></p>' +
      '<table class="g"><tr><td><button class="btn" data-act="photos">Quay lại</button></td><td><button class="btn" data-act="delphoto">Xoá ảnh</button></td></tr></table>';
    papi({ action: "get", ts: p.ts }, function (err, r) {
      if (S.mode !== "photo1" || PH.cur !== i) return;
      var im = document.getElementById("bigimg"), m = document.getElementById("ldmsg");
      if (err) { if (m) m.innerHTML = "Không tải được ảnh lớn."; return; }
      if (im) im.src = r.image; if (m) m.innerHTML = "";
    });
  }
  function delPhoto(btn) {
    var p = PH.list[PH.cur];
    if (!p) return;
    if (!PH.arm) { PH.arm = 1; btn.innerHTML = "Bấm lần nữa để xoá"; btn.className = "btn dark"; return; }
    btn.innerHTML = "Đang xoá...";
    papi({ action: "delete", ts: p.ts }, function (err) {
      if (err) { photos("Không xoá được: " + err.msg); return; }
      PH.list.splice(PH.cur, 1); photos("Đã xoá ảnh.");
    });
  }
  function shrink(img, max, q) {
    var w = img.width, hh = img.height, s = Math.min(1, max / Math.max(w, hh)), cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(hh * s));
    var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", q);
  }
  function uploadFile(f) {
    if (!f) return;
    if (!window.FileReader) { photos("Máy này không gửi ảnh được, hãy dùng điện thoại."); return; }
    photos("Đang xử lý ảnh...");
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var full, thumb;
        try { full = shrink(img, 1280, 0.82); thumb = shrink(img, 260, 0.7); } catch (e) { photos("Không đọc được ảnh này."); return; }
        photos("Đang gửi ảnh lên...");
        papi({ action: "upload", image: full, thumb: thumb }, function (err) {
          if (err) { photos("Chưa gửi được ảnh: " + err.msg); return; }
          PH.list = null; photos("Đã lưu ảnh!");
        });
      };
      img.onerror = function () { photos("Không đọc được ảnh này."); };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  }

  // ================= XỬ LÝ CHẠM =================
  function findBtn(el) {
    while (el && el !== app) { if (el.tagName === "BUTTON") return el; el = el.parentNode; }
    return null;
  }
  app.onclick = function (ev) {
    ev = ev || window.event;
    var b = findBtn(ev.target || ev.srcElement), act, v, q, built, i;
    if (!b) return;
    act = b.getAttribute("data-act"); v = b.getAttribute("data-v");
    if (!act) return;
    var scroll = true;
    if (act === "home") home();
    else if (act === "who0") nameScreen();
    else if (act === "who") {
      var wn = players()[parseInt(v, 10)];
      if (!ONLINE || pins()[wn]) doLogin(wn, pins()[wn]); else nameScreen("Nhập ngày sinh của " + esc(wn) + " nhé.", wn);
    }
    else if (act === "setname") setName();
    else if (act === "backup") backup();
    else if (act === "monsters") monsters();
    else if (act === "photos") { if (S.mode !== "photo1") PH.list = null; PH.msg = ""; photos(); }
    else if (act === "photo") { viewPhoto(parseInt(v, 10)); }
    else if (act === "delphoto") { delPhoto(b); scroll = false; }
    else if (act === "fight") fight(parseInt(v, 10));
    else if (act === "bnext") battleNext();
    else if (act === "restore") restore();
    else if (act === "restore2") restore2();
    else if (act === "map") map();
    else if (act === "pet") pet();
    else if (act === "feed") feed();
    else if (act === "album") album();
    else if (act === "free") freeMenu();
    else if (act === "free1") startFree(v, parseInt(b.getAttribute("data-l"), 10));
    else if (act === "again") startFree(S.subj, S.lvl);
    else if (act === "stage") startStage(parseInt(v, 10));
    else if (act === "opt") {
      if (S.chosen >= 0) return;
      if (S.mode === "battle") { battleAnswer(parseInt(v, 10)); scroll = false; }
      else { S.chosen = parseInt(v, 10); answered(S.chosen === S.qs[S.i].ans); showQ(); scroll = false; }
    } else if (act === "tile") {
      q = S.qs[S.i]; q.built.push(parseInt(v, 10));
      if (q.built.length === q.tiles.length) {
        built = ""; for (i = 0; i < q.built.length; i++) built += q.tiles[q.built[i]];
        answered(built === q.word);
      }
      showXep(); scroll = false;
    } else if (act === "undo") { S.qs[S.i].built.pop(); showXep(); scroll = false; }
    else if (act === "next") next();
    else if (act === "card") { tapCard(parseInt(v, 10)); scroll = false; }
    else if (act === "cardsdone") {
      var m = S.moves; stageResult(0, 0, m <= 10 ? 3 : 2, 6);
    }
    if (scroll) window.scrollTo(0, 0);
  };
  app.onchange = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && el.id === "cam" && el.files && el.files[0]) uploadFile(el.files[0]);
  };
  app.onkeyup = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && (el.id === "nm" || el.id === "dd" || el.id === "mm" || el.id === "yy") && (ev.keyCode === 13 || ev.which === 13)) setName();
    if (el && el.id === "code" && (ev.keyCode === 13 || ev.which === 13)) restore();
  };
  window.__lop1 = { getS: function () { return S; }, MON: MON, monSVG: monSVG, makeCode: makeCode, readCode: readCode, getP: function () { return P; },  mathQ: mathQ, tvQ: tvQ, tvDS: tvDS, mathDS: mathDS, ochuQ: ochuQ, xepQ: xepQ, pairsFor: pairsFor, AW: AW, analyze: analyze, withTone: withTone, STAGES: STAGES, genQ: genQ, petSVG: petSVG };
  var last = lsGet("lop1_last");
  if (last && has(players(), last) && (!ONLINE || pins()[last])) doLogin(last, pins()[last]); else nameScreen();
})();
</script>
