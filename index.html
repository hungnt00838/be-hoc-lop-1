html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body { font-family: "VNSans", "DejaVu Sans", sans-serif; font-size: 24px; line-height: 1.35; }
#app { max-width: 900px; margin: 0 auto; padding: 14px 16px 40px; }
h1 { font-size: 42px; margin: 8px 0 6px; text-align: center; }
h2 { font-size: 30px; margin: 16px 0 10px; text-align: center; }
p.sub { text-align: center; margin: 0 0 16px; font-size: 22px; }
.btn { display: block; width: 100%; box-sizing: border-box; -webkit-box-sizing: border-box;
  margin: 0 0 14px; padding: 16px 8px; min-height: 80px; font-size: 30px; font-family: "VNSans", "DejaVu Sans", sans-serif;
  font-weight: bold; color: #000; background: #fff; border: 4px solid #000; border-radius: 14px;
  text-align: center; cursor: pointer; -webkit-appearance: none; }
.btn.dark { background: #000; color: #fff; }
.btn.small { display: inline-block; width: auto; min-height: 0; padding: 8px 16px; font-size: 22px; margin: 0; border-width: 3px; }
.btn.right, .btn.done { background: #000; color: #fff; }
.btn.wrong { background: #bbb; text-decoration: line-through; border-style: dashed; }
.btn.off { background: #ddd; color: #666; border-style: dashed; }
.btn.back { background: #e6e6e6; }
.btn .s { display: block; font-size: 20px; font-weight: normal; }
table.g { width: 100%; border-collapse: separate; border-spacing: 10px; margin: 0 -10px; table-layout: fixed; }
table.g td { padding: 0; vertical-align: top; }
table.g .btn { margin: 0; }
table.opts .btn { font-size: 38px; min-height: 108px; }
table.cards .btn { font-size: 30px; min-height: 104px; padding: 8px 2px; }
table.map .btn { font-size: 24px; min-height: 104px; padding: 8px 2px; }
.top { overflow: hidden; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
.top .l { float: left; font-size: 22px; padding-top: 8px; }
.top .r { float: right; }
.q { font-size: 38px; text-align: center; margin: 14px 0 18px; }
.q .big { font-size: 62px; font-weight: bold; }
.q .story { font-size: 30px; text-align: left; }
.dots { font-size: 44px; letter-spacing: 8px; line-height: 1.2; }
.fb { font-size: 32px; text-align: center; font-weight: bold; margin: 16px 0; min-height: 42px; }
.score { font-size: 76px; text-align: center; font-weight: bold; margin: 6px 0; }
.stars { font-size: 60px; text-align: center; letter-spacing: 8px; }
.note { font-size: 20px; text-align: center; margin: 10px 0; }
.box { display: inline-block; border: 4px solid #000; min-width: 60px; padding: 0 8px; }
.cell { display: inline-block; border: 4px solid #000; min-width: 64px; height: 76px; line-height: 76px;
  font-size: 50px; font-weight: bold; margin: 3px; text-align: center; vertical-align: middle; }
.cell.q2 { background: #ddd; }
.tiles { text-align: center; margin: 10px 0; }
.tiles .btn { display: inline-block; width: 22%; margin: 1%; font-size: 46px; min-height: 96px; }
.pick { border: 4px solid #000; border-radius: 14px; padding: 4px 14px 12px; margin-bottom: 16px; }
.pet { text-align: center; }
.petbtn { display: block; width: 100%; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.petsay { text-align: center; font-size: 26px; font-weight: bold; margin: 0 0 6px; min-height: 32px; }
.stat { text-align: center; font-size: 24px; margin: 6px 0 16px; }
.stk { text-align: center; border: 3px solid #000; border-radius: 12px; padding: 8px 2px; min-height: 120px; }
.stk b { display: block; font-size: 60px; line-height: 1.1; font-weight: normal; }
.stk.no { border-style: dashed; color: #999; }
.stk span { font-size: 18px; }
.inp { display: block; width: 100%; box-sizing: border-box; -webkit-box-sizing: border-box; font-size: 34px; padding: 14px;
  border: 4px solid #000; border-radius: 14px; margin: 0 0 14px; font-family: "VNSans", "DejaVu Sans", sans-serif; background: #fff; color: #000;  text-transform: capitalize; }
.inp::-webkit-input-placeholder { text-transform: none; }
.code { font-size: 34px; font-weight: bold; text-align: center; letter-spacing: 2px; margin: 14px 0 6px; white-space: nowrap; }
.inp.pin { text-transform: none; text-align: center; padding: 14px 4px; }
table.dob .inp { margin: 0; }
.inp.code-in { text-transform: uppercase; text-align: center; letter-spacing: 2px; }
.grade { text-align: center; font-size: 26px; font-weight: bold; margin: -4px 0 8px; }
.panel { border: 5px solid #000; border-radius: 16px; padding: 18px 8px; margin: 8px 0 12px; text-align: center; min-height: 190px; }
.panel svg { margin: 0 6px; }
.caption { font-size: 32px; line-height: 1.5; text-align: center; font-weight: bold; margin: 8px 4px 18px; }
.story { font-size: 30px; line-height: 1.65; margin: 8px 4px 18px; }
.story.q { text-align: center; font-weight: bold; }
.story-btn { text-align: left; }
.story-btn svg { vertical-align: middle; }
.pic { text-align: center; margin: 4px 0 8px; line-height: 1.1; }
.ic { vertical-align: middle; margin: 2px; }
.op { font-size: 48px; vertical-align: middle; }

      [["bút"], "Na liền cho Hà mượn bút. Hà cảm ơn Na và viết bài thật đẹp."],
      [["kẹo"], "Hôm sau, Hà mang cho Na một cái kẹo. Hai bạn càng thêm thân."]],
      q: [["Ai quên mang bút?", "Bạn Hà", "Bạn Na", "Cô giáo"], ["Na cho Hà mượn gì?", "Bút chì", "Quyển vở", "Cái mũ"], ["Hôm sau Hà mang cho Na gì?", "Cái kẹo", "Quả cam", "Bông hoa"]] },
    { t: "chu", n: "Cơn mưa mùa hè", p: [
      [["cây"], "Trưa hè, trời nóng nực. Cây cối đứng im, lá rủ xuống."],
      [["gió"], "Bỗng gió thổi mạnh. Mây đen kéo đến che kín bầu trời."],
      [["mưa"], "Mưa rơi lộp độp, lộp độp. Mưa tưới mát cả khu vườn."],
      [["lá", "hoa"], "Mưa tạnh, cây lá xanh tươi, hoa nở rực rỡ. Bé reo lên: A, cầu vồng kìa!"]],
      q: [["Trước khi mưa, trời thế nào?", "Nóng nực", "Rất lạnh", "Có tuyết"], ["Mưa tạnh, bé nhìn thấy gì?", "Cầu vồng", "Ông trăng", "Ngọn núi lửa"]] },
    { t: "chu", n: "Bé giúp mẹ", p: [
      [["nhà"], "Chủ nhật, cả nhà bé đều ở nhà."],
      [["cơm"], "Mẹ nấu cơm. Bé giúp mẹ nhặt rau và xếp bát đũa lên bàn."],
      [["ghế", "bàn"], "Bố lau nhà. Bé kê lại ghế cho ngay ngắn."],
      [["cơm", "sao"], "Cả nhà ngồi ăn cơm vui vẻ. Mẹ khen: Con ngoan quá!"]],
      q: [["Bé giúp mẹ làm gì?", "Nhặt rau, xếp bát", "Lau nhà", "Đi chợ"], ["Ai lau nhà?", "Bố", "Bé", "Mẹ"]] },
    { t: "chu", n: "Chú cá vàng", p: [
      [["cá"], "Bé có một chú cá vàng nhỏ. Cá sống trong cái bể kính trên bàn."],
      [["cá", "trăng"], "Sáng nào bé cũng cho cá ăn. Cá bơi vòng vòng, vẫy cái đuôi xinh."],
      [["cá"], "Có một hôm bé mải chơi nên quên. Cá bơi chậm chạp, trông buồn lắm."],
      [["cá", "sao"], "Bé vội cho cá ăn và nói: Xin lỗi cá nhé! Từ đó bé không bao giờ quên nữa."]],
      q: [["Cá vàng sống ở đâu?", "Trong bể kính", "Ngoài sông", "Trên cây"], ["Vì sao có hôm cá buồn?", "Bé quên cho ăn", "Trời mưa", "Cá bị ốm"]] },
    { t: "chu", n: "Ông trăng tròn", p: [
      [["trăng"], "Đêm rằm, ông trăng tròn như cái đĩa, treo trên ngọn tre."],
      [["sao"], "Quanh ông trăng có bao nhiêu là sao. Sao nào cũng nhấp nháy như cười."],
      [["đèn", "nhà"], "Bé cùng các bạn rước đèn quanh xóm. Tiếng hát vang khắp nơi."],
      [["trăng", "nhà"], "Về nhà, bé ngồi ngắm trăng. Bé ước mình được bay lên chơi với ông trăng."]],
      q: [["Đêm rằm, trăng thế nào?", "Tròn", "Khuyết", "Không có trăng"], ["Bé cùng các bạn làm gì?", "Rước đèn", "Đá bóng", "Câu cá"]] }
  ];
  var RD = { k: -1, pg: 0, qi: 0, score: 0, pick: -1, opts: [] };
  function readMenu() {
    S.mode = "readmenu";
    var h = topBar("Tủ truyện"), i, s, n = 0;
    for (i = 0; i < STORIES.length; i++) if (P.rd[i]) n++;
    h += '<p class="sub">Bé đã đọc ' + n + "/" + STORIES.length + " truyện. Đọc xong và trả lời câu hỏi để được hạt thóc!</p>";
    function list(t, title) {
      var r = '<div class="pick"><h2>' + title + "</h2>";
      for (i = 0; i < STORIES.length; i++) {
        s = STORIES[i]; if (s.t !== t) continue;
        r += '<button class="btn story-btn' + '" data-act="story" data-v="' + i + '">' + ic(s.p[0][0][0], 50) + " " + esc(s.n) + (P.rd[i] ? " ✓" : "") + "</button>";
      }
      return r + "</div>";
    }
    app.innerHTML = h + list("tranh", "Truyện tranh") + list("chu", "Truyện chữ");
  }
  function storyPage() {
    S.mode = "story";
    var s = STORIES[RD.k], pg = s.p[RD.pg], last = RD.pg === s.p.length - 1, h, j, big = s.t === "tranh";
    h = topBar((big ? "Truyện tranh" : "Truyện chữ") + " · Trang " + (RD.pg + 1) + "/" + s.p.length, "read");
    h += "<h2>" + esc(s.n) + "</h2>";
    if (big) {
      h += '<div class="panel">';
      for (j = 0; j < pg[0].length; j++) h += ic(pg[0][j], pg[0].length > 2 ? 130 : 170);
      h += '</div><p class="caption">' + esc(pg[1]) + "</p>";
    } else {
      h += '<div class="pic">';
      for (j = 0; j < pg[0].length; j++) h += ic(pg[0][j], 90);
      h += '</div><p class="story">' + esc(pg[1]) + "</p>";
    }
    h += '<table class="g"><tr><td>' + (RD.pg > 0 ? '<button class="btn" data-act="pgprev">Trang trước</button>' : "") + "</td><td>" +
      (last ? '<button class="btn dark" data-act="rdq">Trả lời câu hỏi</button>' : '<button class="btn dark" data-act="pgnext">Trang sau</button>') + "</td></tr></table>";
    app.innerHTML = h;
  }
  function storyQ() {
    S.mode = "storyq";
    var s = STORIES[RD.k], q = s.q[RD.qi], h, i;
    if (RD.pick < 0 && !RD.opts.length) RD.opts = shuffle([1, 2, 3]);
    h = topBar("Câu hỏi " + (RD.qi + 1) + "/" + s.q.length, "read") + "<h2>" + esc(s.n) + '</h2><p class="story q">' + esc(q[0]) + "</p>";
    for (i = 0; i < 3; i++) {
      var o = RD.opts[i], cls = "btn";
      if (RD.pick >= 0) { if (o === 1) cls += " dark"; else if (o === RD.pick) cls += " off"; }
      h += '<button class="' + cls + '" data-act="rdans" data-v="' + o + '">' + (RD.pick >= 0 && o === 1 ? "✓ " : "") + esc(q[o]) + "</button>";
    }
    if (RD.pick >= 0) {
      h += '<p class="fb">' + (RD.pick === 1 ? "Đúng rồi! Giỏi quá!" : "Chưa đúng. Đáp án là: " + esc(q[1])) + "</p>";
      h += '<button class="btn dark" data-act="rdnext">' + (RD.qi < s.q.length - 1 ? "Câu tiếp theo" : "Xem kết quả") + "</button>";
    }
    app.innerHTML = h;
  }
  function storyEnd() {
    S.mode = "storyend";
    var s = STORIES[RD.k], first = !P.rd[RD.k], gain = first ? 2 + RD.score : RD.score;
    P.rd[RD.k] = 1; P.seeds += gain; save();
    app.innerHTML = topBar("Đọc xong", "read") + "<h1>Bé đọc xong truyện!</h1><h2>" + esc(s.n) + "</h2>" +
      '<p class="fb">Đúng ' + RD.score + "/" + s.q.length + " câu</p>" +
      '<p class="sub">Bé được thêm <b>' + gain + "</b> hạt thóc" + (first ? " (có thưởng đọc lần đầu)" : "") + ".</p>" +
      '<button class="btn" data-act="story" data-v="' + RD.k + '">Đọc lại truyện này</button>' +
      '<button class="btn dark" data-act="read">Chọn truyện khác</button>';
  }

  // ================= GHI CHÚ CỦA BÉ =================
  var NT = { list: null, msg: "", arm: -1 };
  function notesScreen(msg) {
    S.mode = "notes";
    if (msg !== undefined) NT.msg = msg;
    var h = topBar("Ghi chú") + "<h1>Ghi chú của " + nm() + "</h1>", i, n;
    if (!ONLINE || !PIN) { app.innerHTML = h + '<p class="sub">Cần mở game qua trang web và đăng nhập bằng tên + ngày sinh để lưu ghi chú.</p>'; return; }
    h += '<textarea id="note" class="inp note" maxlength="500" rows="4" placeholder="Bé viết ghi chú ở đây..."></textarea>' +
      '<button class="btn dark" data-act="addnote">Lưu ghi chú</button>';
    if (NT.msg) h += '<div class="fb">' + NT.msg + "</div>";
    if (NT.list === null) { app.innerHTML = h + '<p class="sub">Đang tải ghi chú...</p>'; loadNotes(); return; }
    if (!NT.list.length) h += '<p class="sub">Chưa có ghi chú nào.</p>';
    for (i = 0; i < NT.list.length; i++) {
      n = NT.list[i];
      h += '<div class="pick notebox"><div class="note-d">' + dstr(n.ts) + " " + pad2(new Date(n.ts).getHours()) + ":" + pad2(new Date(n.ts).getMinutes()) + "</div>" +
        '<div class="note-t">' + esc(n.text).replace(/\n/g, "<br>") + "</div>" +
        '<button class="btn small' + (NT.arm === i ? " dark" : "") + '" data-act="delnote" data-v="' + i + '">' + (NT.arm === i ? "Bấm lần nữa để xoá" : "Xoá") + "</button></div>";
    }
    app.innerHTML = h;
  }
  function loadNotes() {
    api({ action: "notes", name: NAME, pin: PIN }, function (err, r) {
      if (S.mode !== "notes") return;
      NT.list = err ? [] : r.notes;
      notesScreen(err ? "Không tải được ghi chú: " + err.msg : undefined);
    });
  }
  function addNote() {
    var el = document.getElementById("note"), t = el && el.value ? String(el.value).replace(/^\s+|\s+$/g, "") : "";
    if (!t) { notesScreen("Bé chưa viết gì cả!"); return; }
    NT.arm = -1;
    app.innerHTML = topBar("Ghi chú") + '<h2>Đang lưu...</h2>';
    api({ action: "addNote", name: NAME, pin: PIN, text: t }, function (err, r) {
      if (err) { NT.msg = "Chưa lưu được: " + err.msg; notesScreen(); var e2 = document.getElementById("note"); if (e2) e2.value = t; return; }
      NT.list = r.notes; notesScreen("Đã lưu ghi chú!");
    });
  }
  function delNote(i) {
    if (NT.arm !== i) { NT.arm = i; NT.msg = ""; notesScreen(); return; }
    var n = NT.list[i]; NT.arm = -1;
    if (!n) return;
    api({ action: "delNote", name: NAME, pin: PIN, ts: n.ts }, function (err, r) {
      if (err) { notesScreen("Không xoá được: " + err.msg); return; }
      NT.list = r.notes; notesScreen("Đã xoá ghi chú.");
    });
  }

  // ================= XỬ LÝ CHẠM =================
  function findBtn(el) {
    while (el && el !== app) { if (el.tagName === "BUTTON") return el; el = el.parentNode; }
    return null;
  }
  app.onclick = function (ev) {
    ev = ev || window.event;
    var b = findBtn(ev.target || ev.srcElement), act, v, q, built, i;
    if (!b) return;
    act = b.getAttribute("data-act"); v = b.getAttribute("data-v");
    if (!act) return;
    var scroll = true;
    if (act === "home") home();
    else if (act === "who0") nameScreen();
    else if (act === "who") {
      var wn = players()[parseInt(v, 10)];
      if (!ONLINE || pins()[wn]) doLogin(wn, pins()[wn]); else nameScreen("Nhập ngày sinh của " + esc(wn) + " nhé.", wn);
    }
    else if (act === "setname") setName();
    else if (act === "backup") backup();
    else if (act === "monsters") monsters();
    else if (act === "read") readMenu();
    else if (act === "story") { RD.k = parseInt(v, 10); RD.pg = 0; storyPage(); }
    else if (act === "pgnext") { RD.pg++; storyPage(); }
    else if (act === "pgprev") { RD.pg--; storyPage(); }
    else if (act === "rdq") { RD.qi = 0; RD.score = 0; RD.pick = -1; RD.opts = []; storyQ(); }
    else if (act === "rdans") { if (RD.pick < 0) { RD.pick = parseInt(v, 10); if (RD.pick === 1) RD.score++; storyQ(); } scroll = false; }
    else if (act === "rdnext") { RD.qi++; RD.pick = -1; RD.opts = []; if (RD.qi < STORIES[RD.k].q.length) storyQ(); else storyEnd(); }
    else if (act === "notes") { NT.list = null; NT.msg = ""; NT.arm = -1; notesScreen(); }
    else if (act === "addnote") addNote();
    else if (act === "delnote") { delNote(parseInt(v, 10)); scroll = false; }
    else if (act === "photos") { if (S.mode !== "photo1") { PH.list = null; PH.last = null; } PH.msg = ""; photos(); }
    else if (act === "photo") { viewPhoto(parseInt(v, 10)); }
    else if (act === "undophoto") { undoPhoto(b); scroll = false; }
    else if (act === "zoomph") { PH.zoom = !PH.zoom; previewPhoto(); scroll = false; }
    else if (act === "rotph") { PH.base = toCanvas(PH.base, 2400, 90); PH.crop = { x: 0, y: 0, w: 1, h: 1 }; cropScreen(); scroll = false; }
    else if (act === "cropall") { PH.crop = { x: 0, y: 0, w: 1, h: 1 }; placeCrop(); scroll = false; }
    else if (act === "cropdone") cropDone();
    else if (act === "recrop") { if (PH.base) cropScreen(); }
    else if (act === "savephoto") savePending();
    else if (act === "cancelph") { PH.pending = null; PH.base = null; photos("Đã huỷ, ảnh không được lưu."); }
    else if (act === "keepphoto") { PH.last = null; PH.msg = ""; photos(); }
    else if (act === "delphoto") { delPhoto(b); scroll = false; }
    else if (act === "fight") fight(parseInt(v, 10));
    else if (act === "bnext") battleNext();
    else if (act === "restore") restore();
    else if (act === "restore2") restore2();
    else if (act === "map") map();
    else if (act === "pet") pet();
    else if (act === "feed") { feed(); setTimeout(function () { petWiggle(true); }, 300); }
    else if (act === "poke") { petWiggle(true); scroll = false; }
    else if (act === "album") album();
    else if (act === "free") freeMenu();
    else if (act === "free1") startFree(v, parseInt(b.getAttribute("data-l"), 10));
    else if (act === "again") startFree(S.subj, S.lvl);
    else if (act === "stage") startStage(parseInt(v, 10));
    else if (act === "opt") {
      if (S.chosen >= 0) return;
      if (S.mode === "battle") { battleAnswer(parseInt(v, 10)); scroll = false; }
      else { S.chosen = parseInt(v, 10); answered(S.chosen === S.qs[S.i].ans); showQ(); scroll = false; }
    } else if (act === "tile") {
      q = S.qs[S.i]; q.built.push(parseInt(v, 10));
      if (q.built.length === q.tiles.length) {
        built = ""; for (i = 0; i < q.built.length; i++) built += q.tiles[q.built[i]];
        answered(built === q.word);
      }
      showXep(); scroll = false;
    } else if (act === "undo") { S.qs[S.i].built.pop(); showXep(); scroll = false; }
    else if (act === "next") next();
    else if (act === "card") { tapCard(parseInt(v, 10)); scroll = false; }
    else if (act === "cardsdone") {
      var m = S.moves; stageResult(0, 0, m <= 10 ? 3 : 2, 6);
    }
    if (scroll) window.scrollTo(0, 0);
  };
  app.onchange = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && el.id === "cam" && el.files && el.files[0]) uploadFile(el.files[0]);
  };
  app.onkeyup = function (ev) {
    ev = ev || window.event;
    var el = ev.target || ev.srcElement;
    if (el && (el.id === "nm" || el.id === "dd" || el.id === "mm" || el.id === "yy") && (ev.keyCode === 13 || ev.which === 13)) setName();
    if (el && el.id === "code" && (ev.keyCode === 13 || ev.which === 13)) restore();
  };
  window.__lop1 = { getS: function () { return S; }, PH: PH, papi: papi, MON: MON, monSVG: monSVG, makeCode: makeCode, readCode: readCode, getP: function () { return P; },  mathQ: mathQ, tvQ: tvQ, tvDS: tvDS, mathDS: mathDS, ochuQ: ochuQ, xepQ: xepQ, pairsFor: pairsFor, AW: AW, analyze: analyze, withTone: withTone, STAGES: STAGES, genQ: genQ, petSVG: petSVG };
  var last = lsGet("lop1_last");
  if (last && has(players(), last) && (!ONLINE || pins()[last])) doLogin(last, pins()[last]); else nameScreen();
})();
</script>
</body>
